        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #f8fafc;
            overflow-x: hidden;
        }
        
        /* Premium Glassmorphism */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        /* Glowing Text */
        .text-glow {
            text-shadow: 0 0 25px rgba(34, 211, 238, 0.45);
        }

        /* Dynamic Background Grid */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 85%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        /* Typing cursor */
        .cursor::after {
            content: '|';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Animated Submit Button */
        .btn-glow {
            position: relative;
            z-index: 1;
        }
        .btn-glow::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #22d3ee, #a855f7, #3b82f6, #a855f7);
            z-index: -1;
            border-radius: 14px;
            background-size: 400%;
            animation: gradient-x 4s linear infinite;
            transition: opacity 0.3s ease;
            opacity: 0.8;
        }
        .btn-glow:hover::before {
            opacity: 1;
            filter: blur(10px);
        }

        // Router Navigation Function
        function navigateTo(route) {
            if (!routes[route]) route = 'home';
            
            // Update browser hash cleanly (e.g. #home, #projects)
            window.location.hash = route;
            
            // Render route content into app view container
            const container = document.getElementById('app-view');
            container.innerHTML = routes[route];
            
            // Scroll to top on navigation
            window.scrollTo({ top: 0, behavior: 'smooth' });
            
            // Update Active Nav Button styling
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-white', 'bg-slate-800', 'shadow-sm');
                btn.classList.add('text-slate-400');
            });
            const activeBtn = document.getElementById(`nav-${route}`);
            if (activeBtn) {
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-white', 'bg-slate-800', 'shadow-sm');
            }

            // If home route, trigger typewriter effect
            if (route === 'home') {
                setTimeout(startTypewriter, 300);
            }
        }

        // Handle browser back/forward and initial load
        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.replace('#', '') || 'home';
            navigateTo(hash);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const initialRoute = window.location.hash.replace('#', '') || 'home';
            navigateTo(initialRoute);
        });

        // Typewriter Effect Logic for Home Route
        let typingTimeout = null;
        function startTypewriter() {
            const el = document.getElementById("typewriter");
            if (!el) return;

            const phrases = [
                "Web Developer at Headdles.",
                "Lead Systems at Qyrex CEO.",
                "Building high-performance Python & Luau systems.",
                "Crafting clean web architectures."
            ];
            let currentPhrase = 0;
            let isDeleting = false;
            let charIndex = 0;
            
            if (typingTimeout) clearTimeout(typingTimeout);

            function type() {
                const targetEl = document.getElementById("typewriter");
                if (!targetEl) return;

                const text = phrases[currentPhrase];
                
                if (isDeleting) {
                    targetEl.innerText = text.substring(0, charIndex - 1);
                    charIndex--;
                } else {
                    targetEl.innerText = text.substring(0, charIndex + 1);
                    charIndex++;
                }
                
                let speed = isDeleting ? 30 : 100;
                
                if (!isDeleting && charIndex === text.length) {
                    speed = 2000;
                    isDeleting = true;
                } else if (isDeleting && charIndex === 0) {
                    isDeleting = false;
                    currentPhrase = (currentPhrase + 1) % phrases.length;
                    speed = 500;
                }
                
                typingTimeout = setTimeout(type, speed);
            }
            
            type();
        }

        // Settings Modal Toggle
        function toggleSettings() {
            const modal = document.getElementById('settingsModal');
            const content = document.getElementById('settingsContent');
            
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                void modal.offsetWidth;
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
                content.classList.add('scale-100');
            } else {
                modal.classList.add('opacity-0');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                }, 300);
            }
        }
